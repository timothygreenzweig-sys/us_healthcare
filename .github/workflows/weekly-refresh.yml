name: Weekly data refresh

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild dashboard from live CDC data
        run: python3 build_dashboard.py

      - name: Commit refreshed dashboard if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No data changes this week — nothing to commit."
          else
            git commit -m "Weekly data refresh: $(date -u +%Y-%m-%d)"
            git push
            echo "Committed refreshed index.html."
          fi
